# Azure tenant registered on domain admin@4esnok.su with VS subscription
entraid_tenant_id: 05af71f4-43e2-4c1a-8917-3bf5cb165cfe

# Tier 1 (entraid): day-two users, groups, applications, Conditional Access, governance, management groups.
# Admin and break-glass users and tier-0 groups are in bootstrap/Azure/<tenant>/config.yaml.

entra_id:
  users:
    - mail_nickname: sysadmin
      user_principal_name: sysadmin@vs.4esnok.su
      display_name: "(ADM) User"
      organization:
        department: sysadmins
        job_title: Site Reliability Engineer
      entraid_role_names:  # direct entraid role assignments
        - Global Administrator
      password:
        onepassword_vault: "cloud_r1"

    - mail_nickname: "developer1"
      user_principal_name: "developer@vs.4esnok.su"
      display_name: "(DEV) User"
      organization:
        department: "developers"
        job_title: "developer"

  groups:
    - display_name: "sg-az-aks-admin-t2"
      description: "Admin access to AKS clusters"
      members: [sysadmin]  # user mail_nicknames or application display names

    # Workspace 4esnok_vs_azure_mgmt_r1 (ESLZ/management); its roles are assigned by ESLZ/governance:
    # Contributor on its resource group (subscriptions/platform-management.yaml), RBAC Administrator on mg-4esnok
    - display_name: sg-az-mgmt-contributor-t2
      description: Contributor on rg-mgmt-dev-nzn-01, constrained RBAC Administrator on mg-4esnok (ESLZ/management)
      members: [sp-prd-az-mgmt-contributor-hcp-workspace-t2]

    # Users' Azure RBAC on the Visual Studio subscription (44b9d159-d353-477f-b94f-5ce0f3bd33f1), assigned by
    # ESLZ/governance: subscriptions/admin-4esnok-su-vs.yaml, and the Grafana roles in platform-management.yaml.
    # Pipelines get their roles on their own resource groups, never through these groups.
    - display_name: "sg-az-sub-vs-contributor-t1"
      description: "Users: Contributor on the Visual Studio subscription, Grafana Admin"
      members: [sysadmin]
    - display_name: "sg-az-sub-vs-reader-t1"
      description: "Users: Reader on the Visual Studio subscription, Grafana Viewer"
      members: []

    # # Tier-2 workload cortex (ESLZ/workloads/cortex): Contributor on its resource group rg-cortex-dev-nzn-01,
    # # assigned by ESLZ/governance (subscriptions/landingzone-cortex.yaml).
    # - display_name: "sg-az-cortex-contributor-t2"
    #   description: "Users: Contributor on the cortex resource group"
    #   members: []

  applications:  # app registrations and their enterprise applications (service principals)
    # Identities of HCP Terraform workspaces (dynamic credentials, OIDC). Those of the tier-1 workspaces (entraid,
    # ESLZ/governance) are in tier 0.

    # Workspace 4esnok_vs_azure_mgmt_r1 (ESLZ/management). Azure RBAC from sg-az-mgmt-contributor-t2.
    - display_name: sp-prd-az-mgmt-contributor-hcp-workspace-t2
      description: HCP TF workspace 4esnok_vs_azure_mgmt_r1
      federated_credentials:
        - name: hcp-4esnok_vs_azure_mgmt_r1-apply
          subject: organization:4esnok:project:4esnok_vs_r1:workspace:4esnok_vs_azure_mgmt_r1:run_phase:apply
        - name: hcp-4esnok_vs_azure_mgmt_r1-plan
          subject: organization:4esnok:project:4esnok_vs_r1:workspace:4esnok_vs_azure_mgmt_r1:run_phase:plan

    # Workspace 4esnok_vs_azure_networking_r1 (ESLZ/connectivity). Directory.Read.All resolves the principal names
    # in its subnet consumers. Azure RBAC on resource group rg-connectivity-dev-nzn-01 only, assigned by ESLZ/governance
    # (subscriptions/platform-connectivity.yaml): Reader (plan); Contributor, and RBAC Administrator limited to
    # Windows 365 Network User for subnet consumers (apply).
    - display_name: "sp-hcp-azure-networking-r1-plan"
      description: "HCP Terraform plan runs of 4esnok/4esnok_vs_r1/4esnok_vs_azure_networking_r1"
      federated_credentials:
        - name: "hcp-4esnok_vs_azure_networking_r1-plan"
          subject: "organization:4esnok:project:4esnok_vs_r1:workspace:4esnok_vs_azure_networking_r1:run_phase:plan"
      graph_app_roles:  # Microsoft Graph application permissions
        - Directory.Read.All

    - display_name: "sp-hcp-azure-networking-r1-apply"
      description: "HCP Terraform apply runs of 4esnok/4esnok_vs_r1/4esnok_vs_azure_networking_r1"
      federated_credentials:
        - name: "hcp-4esnok_vs_azure_networking_r1-apply"
          subject: "organization:4esnok:project:4esnok_vs_r1:workspace:4esnok_vs_azure_networking_r1:run_phase:apply"
      graph_app_roles:
        - Directory.Read.All

    # Workspace 4esnok_vs_azure_cortex_r2 (tier 2, ESLZ/workloads/cortex). No subscription-wide rights:
    # ESLZ/governance (subscriptions/landingzone-cortex.yaml) assigns Reader (plan) and Contributor (apply) on
    # resource group rg-cortex-dev-nzn-01 only.
    - display_name: "sp-hcp-4esnok-su-cortex-t2-plan-r0"
      description: "HCP Terraform plan runs of 4esnok/4esnok_vs_r2/4esnok_vs_azure_cortex_r2"
      federated_credentials:
        - name: "hcp-4esnok_vs_azure_cortex_r2-plan"
          subject: "organization:4esnok:project:4esnok_vs_r2:workspace:4esnok_vs_azure_cortex_r2:run_phase:plan"

    - display_name: "sp-hcp-4esnok-su-cortex-t2-apply-r0"
      description: "HCP Terraform apply runs of 4esnok/4esnok_vs_r2/4esnok_vs_azure_cortex_r2"
      federated_credentials:
        - name: "hcp-4esnok_vs_azure_cortex_r2-apply"
          subject: "organization:4esnok:project:4esnok_vs_r2:workspace:4esnok_vs_azure_cortex_r2:run_phase:apply"

    # Example: an application with a client secret stored in 1Password and a direct EntraID role,
    # used as a group member by display name.
    # - display_name: "sp-t1-example-directory-read"
    #   client_secret:
    #     key_vault_name: "azure_t1"  # 1Password vault
    #     rotation_days: 180          # optional, default 180
    #     overlap_days: 30            # optional, default 30: validity after the rotation date
    #   entraid_role_names:
    #     - Directory Readers
    # (and under groups: members: [sp-t1-example-directory-read])

