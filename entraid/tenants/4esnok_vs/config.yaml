# Azure tenant registered on domain admin@4esnok.su with VS subscription
entraid_tenant_id: 05af71f4-43e2-4c1a-8917-3bf5cb165cfe

# Tier 1 (entraid): day-two users, groups, applications, Conditional Access, governance, management groups.
# Admin and break-glass users and tier-0 groups are in bootstrap/Azure/<tenant>/config.yaml.

entra_id:
  # Users managed by tier 0 (bootstrap/Azure). Users are referenced by mail_nickname everywhere in the config.
  existing_users:
    - mail_nickname: "sysadmin"
    - mail_nickname: "breakglass01"

  # users:
  #   - mail_nickname: "developer1"
  #     user_principal_name: "developer@4esnok.su"
  #     display_name: "(DEV) User"
  #     organization:
  #       department: "developers"
  #       job_title: "developer"

  groups:
    - display_name: "sg-t2-az-aks-admin"
      description: "Admin access to AKS clusters"
      members:  # user mail_nicknames or application display names
        - sysadmin

    # Azure RBAC on the Visual Studio subscription (44b9d159-d353-477f-b94f-5ce0f3bd33f1), separate groups for
    # users and for applications. The user groups' roles are assigned by ESLZ/subscriptions; the application
    # groups' roles are assigned on management group mg-landingzones (management_groups below), which the
    # subscription inherits once it is moved there.
    - display_name: "sg-t1-az-sub-vs-contributor"
      description: "Users: Contributor on the Visual Studio subscription"
      members:
        - sysadmin
    - display_name: "sg-t1-az-sub-vs-reader"
      description: "Users: Reader on the Visual Studio subscription"
      members: []
    - display_name: "sg-t1-az-sub-vs-apps-contributor"
      description: "Applications: Contributor and constrained RBAC Administrator on the Visual Studio subscription"
      members:
        - sp-hcp-4esnok-su-subscriptions-t1-apply-r0
        - sp-hcp-4esnok-su-connectivity-t1-apply-r0
        - sp-hcp-4esnok-su-management-t1-apply-r0
    - display_name: "sg-t1-az-sub-vs-apps-reader"
      description: "Applications: Reader on the Visual Studio subscription"
      members:
        - sp-hcp-4esnok-su-subscriptions-t1-plan-r0
        - sp-hcp-4esnok-su-connectivity-t1-plan-r0
        - sp-hcp-4esnok-su-management-t1-plan-r0

    # Tier-2 workload cortex (ESLZ/workloads/cortex): Contributor on its resource group rg-cortex-dev-nzn-01,
    # assigned by ESLZ/subscriptions.
    - display_name: "sg-t2-az-cortex-contributor"
      description: "Users: Contributor on the cortex resource group"
      members:
        - sysadmin

  applications:  # app registrations and their enterprise applications (service principals)
    # federated_credentials are kept for the HCP Terraform integration, which is being reworked; they are not
    # applied until then (see bootstrap/Azure/README.md).
    # HCP Terraform workspace 4esnok_su_entraid_t0_t1 (Azure tier 0) signs in with OIDC:
    # plan runs use the read-only identity, apply runs the privileged one.
    - display_name: "sp-hcp-4esnok-su-entraid-t0_t1-plan-r3"
      description: "HCP Terraform plan runs of 4esnok/4esnok_su_azure/4esnok_su_entraid_t0_t1"
      owners:
        - sysadmin
      federated_credentials:
        - name: "hcp-plan"
          issuer: "https://app.terraform.io"
          subject: "organization:4esnok:project:4esnok_su_azure:workspace:4esnok_su_entraid_t0_t1:run_phase:plan"
      graph_app_roles:  # Microsoft Graph application permissions
        - Directory.Read.All
        - Application.Read.All
        - RoleManagement.Read.Directory
        - Policy.Read.All

    - display_name: "sp-hcp-4esnok-su-entraid-t0_t1-apply-r0"
      description: "HCP Terraform apply runs of 4esnok/4esnok_su_azure/4esnok_su_entraid_t0_t1"
      owners:
        - sysadmin
      federated_credentials:
        - name: "hcp-apply"
          issuer: "https://app.terraform.io"
          subject: "organization:4esnok:project:4esnok_su_azure:workspace:4esnok_su_entraid_t0_t1:run_phase:apply"
      graph_app_roles:
        - User.ReadWrite.All
        - Group.ReadWrite.All
        - Application.ReadWrite.All
        - AppRoleAssignment.ReadWrite.All
        - RoleManagement.ReadWrite.Directory
        - Directory.Read.All                  # data sources (domains, role templates)
        - Policy.Read.All
        - Policy.ReadWrite.ConditionalAccess  # security defaults (and Conditional Access)
        - Policy.ReadWrite.Authorization

    # HCP Terraform workspace 4esnok_su_subscriptions (Azure tier 1, ESLZ/subscriptions) signs in with OIDC.
    # Directory.Read.All resolves the principal names in its role assignments. Azure RBAC comes from group
    # membership: sg-t1-az-sub-vs-apps-reader (plan) and sg-t1-az-sub-vs-apps-contributor (apply).
    - display_name: "sp-hcp-4esnok-su-subscriptions-t1-plan-r0"
      description: "HCP Terraform plan runs of 4esnok/4esnok_su_azure/4esnok_su_subscriptions"
      owners:
        - sysadmin
      federated_credentials:
        - name: "hcp-plan"
          issuer: "https://app.terraform.io"
          subject: "organization:4esnok:project:4esnok_su_azure:workspace:4esnok_su_subscriptions:run_phase:plan"
      graph_app_roles:
        - Directory.Read.All

    - display_name: "sp-hcp-4esnok-su-subscriptions-t1-apply-r0"
      description: "HCP Terraform apply runs of 4esnok/4esnok_su_azure/4esnok_su_subscriptions"
      owners:
        - sysadmin
      federated_credentials:
        - name: "hcp-apply"
          issuer: "https://app.terraform.io"
          subject: "organization:4esnok:project:4esnok_su_azure:workspace:4esnok_su_subscriptions:run_phase:apply"
      graph_app_roles:
        - Directory.Read.All

    # HCP Terraform workspace 4esnok_su_connectivity (Azure tier 1, ESLZ/connectivity) signs in with OIDC.
    # Directory.Read.All resolves the principal names in its subnet consumers. Azure RBAC comes from group
    # membership: sg-t1-az-sub-vs-apps-reader (plan) and sg-t1-az-sub-vs-apps-contributor (apply).
    - display_name: "sp-hcp-4esnok-su-connectivity-t1-plan-r0"
      description: "HCP Terraform plan runs of 4esnok/4esnok_su_azure/4esnok_su_connectivity"
      owners:
        - sysadmin
      federated_credentials:
        - name: "hcp-plan"
          issuer: "https://app.terraform.io"
          subject: "organization:4esnok:project:4esnok_su_azure:workspace:4esnok_su_connectivity:run_phase:plan"
      graph_app_roles:
        - Directory.Read.All

    - display_name: "sp-hcp-4esnok-su-connectivity-t1-apply-r0"
      description: "HCP Terraform apply runs of 4esnok/4esnok_su_azure/4esnok_su_connectivity"
      owners:
        - sysadmin
      federated_credentials:
        - name: "hcp-apply"
          issuer: "https://app.terraform.io"
          subject: "organization:4esnok:project:4esnok_su_azure:workspace:4esnok_su_connectivity:run_phase:apply"
      graph_app_roles:
        - Directory.Read.All

    # HCP Terraform workspace 4esnok_su_management (Azure tier 1, ESLZ/management: Log Analytics) signs in with
    # OIDC. Azure RBAC comes from group membership: sg-t1-az-sub-vs-apps-reader (plan) and
    # sg-t1-az-sub-vs-apps-contributor (apply).
    - display_name: "sp-hcp-4esnok-su-management-t1-plan-r0"
      description: "HCP Terraform plan runs of 4esnok/4esnok_su_azure/4esnok_su_management"
      owners:
        - sysadmin
      federated_credentials:
        - name: "hcp-plan"
          issuer: "https://app.terraform.io"
          subject: "organization:4esnok:project:4esnok_su_azure:workspace:4esnok_su_management:run_phase:plan"

    - display_name: "sp-hcp-4esnok-su-management-t1-apply-r0"
      description: "HCP Terraform apply runs of 4esnok/4esnok_su_azure/4esnok_su_management"
      owners:
        - sysadmin
      federated_credentials:
        - name: "hcp-apply"
          issuer: "https://app.terraform.io"
          subject: "organization:4esnok:project:4esnok_su_azure:workspace:4esnok_su_management:run_phase:apply"

    # HCP Terraform workspace 4esnok_su_cortex (Azure tier 2, ESLZ/workloads/cortex) signs in with OIDC.
    # No subscription-wide rights: ESLZ/subscriptions assigns Reader (plan) and Contributor (apply) on
    # resource group rg-cortex-dev-nzn-01 only.
    - display_name: "sp-hcp-4esnok-su-cortex-t2-plan-r0"
      description: "HCP Terraform plan runs of 4esnok/4esnok_su_azure/4esnok_su_cortex"
      owners:
        - sysadmin
      federated_credentials:
        - name: "hcp-plan"
          issuer: "https://app.terraform.io"
          subject: "organization:4esnok:project:4esnok_su_azure:workspace:4esnok_su_cortex:run_phase:plan"

    - display_name: "sp-hcp-4esnok-su-cortex-t2-apply-r0"
      description: "HCP Terraform apply runs of 4esnok/4esnok_su_azure/4esnok_su_cortex"
      owners:
        - sysadmin
      federated_credentials:
        - name: "hcp-apply"
          issuer: "https://app.terraform.io"
          subject: "organization:4esnok:project:4esnok_su_azure:workspace:4esnok_su_cortex:run_phase:apply"

