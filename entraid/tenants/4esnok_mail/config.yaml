# Microsoft 365 tenant for mail.4esnok.su (Entra ID P1)
entraid_tenant_id: 0fe4f648-bd9a-4476-b9e3-38a2f8cd242c

# Tier 1 (entraid): day-two users, groups, applications, Conditional Access, governance, management groups.
# Admin and break-glass users and tier-0 groups are in bootstrap/Azure/<tenant>/config.yaml.

entra_id:
  # Users are referenced by mail_nickname everywhere in the config. Tier-0 users (bootstrap/Azure) can't be named
  # here.
  users:
    - mail_nickname: "developer1"
      user_principal_name: "developer@mail.4esnok.su"
      display_name: "Dev User"
      organization:
        department: "developers"
        job_title: "developer"

  # PIM needs Entra ID P2, which this tenant does not have (see the example below)
  # pim_roles:
  #   - role_name: "Global Reader"
  #     assignment_type: "User"
  #     assignee_name: "developer1"
  #     duration: "PT8H"

  # Conditional Access (Entra ID P1).
  # CA001 and CA002 together replace security defaults; CA003 is report-only until admins have FIDO2 keys.
  # Security defaults must be turned off first, in the portal (see entraid/README.md#mfa).
  conditional_access_policies:
    - display_name: "CA001 Block legacy authentication"
      state: enabled
      users:
        include: [All]
      client_app_types: [exchangeActiveSync, other]
      grant:
        controls: [block]

    - display_name: "CA002 Require MFA for all users"
      state: enabled
      users:
        include: [All]
      grant:
        controls: [mfa]

    - display_name: "CA003 Require phishing-resistant MFA for admins"
      state: enabledForReportingButNotEnforced  # report-only; set to enabled once admins use FIDO2 keys
      users:
        include_roles:
          - Global Administrator
          - Privileged Role Administrator
          - Security Administrator
          - User Administrator
          - Application Administrator
          - Cloud Application Administrator
          - Conditional Access Administrator
          - Exchange Administrator
      grant:
        authentication_strength: "Phishing-resistant MFA"

