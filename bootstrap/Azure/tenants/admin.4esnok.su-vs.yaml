# Azure tenant registered on domain admin@4esnok.su with VS subscription
default_custom_domain: 4esnok.su
default_domain: admin4esnok.onmicrosoft.com
entraid_tenant_id: 05af71f4-43e2-4c1a-8917-3bf5cb165cfe

users:
  - user_principal_name: "sysadmin@4esnok.su"
    display_name: "(ADM) User"
    department: "sysadmins"
    job_title: "Site Reliability Engineer"
    mail_nickname: "sysadmin"
    # EntraID assignment
    entraid_role_names:  # direct entraid role assignments
      - Global Administrator

    # onepassword
    store_password_in_key_vault: true
    key_vault_name: "azure_t1"

  # - user_principal_name: "developer@4esnok.su"
  #   display_name: "(DEV) User"
  #   department: "developers"
  #   job_title: "developer"
  #   mail_nickname: "developer1"

  # Emergency access (break-glass) account: cloud-only, on the onmicrosoft.com domain, excluded from
  # Conditional Access. Register a FIDO2 key for it and test the sign-in regularly.
  - user_principal_name: "breakglass01@admin4esnok.onmicrosoft.com"
    display_name: "Break Glass 01"
    department: "sysadmins"
    job_title: "Emergency access account"
    mail_nickname: "breakglass01"
    break_glass: true
    password_length: 64
    entraid_role_names:
      - Global Administrator
    store_password_in_key_vault: true
    key_vault_name: "azure_t1"

groups:
  - display_name: "sg-t0-entra-tenant-globaladmin"
    description: "Global Administrator role for the tenant, doesn't work because the tenant is on the free tier"
    assignable_to_role: false  # Requires AAD Premium.
    # entraid_role_names:
    #   - Global Administrator
    members:
      - sysadmin@4esnok.su
  - display_name: "sg-t2-az-aks-admin"
    description: "Admin access to AKS clusters"
    members:  # user principal names or application display names
      - sysadmin@4esnok.su

  # Azure RBAC on the Visual Studio subscription (44b9d159-d353-477f-b94f-5ce0f3bd33f1), separate groups for
  # users and for applications. The user groups' roles are assigned by ESLZ/subscriptions; the application
  # groups' roles are assigned once by hand (see ESLZ/subscriptions/README.md), as the pipeline cannot grant
  # itself access.
  - display_name: "sg-t1-az-sub-vs-owner"
    description: "Users: Owner on the Visual Studio subscription"
    members:
      - sysadmin@4esnok.su
  - display_name: "sg-t1-az-sub-vs-reader"
    description: "Users: Reader on the Visual Studio subscription"
    members: []
  - display_name: "sg-t1-az-sub-vs-apps-owner"
    description: "Applications: Owner on the Visual Studio subscription"
    members:
      - sp-hcp-4esnok-su-subscriptions-t1-apply-r0
  - display_name: "sg-t1-az-sub-vs-apps-reader"
    description: "Applications: Reader on the Visual Studio subscription"
    members:
      - sp-hcp-4esnok-su-subscriptions-t1-plan-r0

applications:  # app registrations and their enterprise applications (service principals)
  # HCP Terraform workspace 4esnok_su_entraid_t0_t1 (Azure tier 0) signs in with OIDC:
  # plan runs use the read-only identity, apply runs the privileged one.
  - display_name: "sp-hcp-4esnok-su-entraid-t0_t1-plan-r3"
    description: "HCP Terraform plan runs of 4esnok/4esnok_su_azure/4esnok_su_entraid_t0_t1"
    owners:
      - sysadmin@4esnok.su
    federated_credentials:
      - name: "hcp-plan"
        issuer: "https://app.terraform.io"
        subject: "organization:4esnok:project:4esnok_su_azure:workspace:4esnok_su_entraid_t0_t1:run_phase:plan"
    graph_app_roles:  # Microsoft Graph application permissions
      - Directory.Read.All
      - Application.Read.All
      - RoleManagement.Read.Directory
      - Policy.Read.All

  - display_name: "sp-hcp-4esnok-su-entraid-t0_t1-apply-r0"
    description: "HCP Terraform apply runs of 4esnok/4esnok_su_azure/4esnok_su_entraid_t0_t1"
    owners:
      - sysadmin@4esnok.su
    federated_credentials:
      - name: "hcp-apply"
        issuer: "https://app.terraform.io"
        subject: "organization:4esnok:project:4esnok_su_azure:workspace:4esnok_su_entraid_t0_t1:run_phase:apply"
    graph_app_roles:
      - User.ReadWrite.All
      - Group.ReadWrite.All
      - Application.ReadWrite.All
      - AppRoleAssignment.ReadWrite.All
      - RoleManagement.ReadWrite.Directory
      - Directory.Read.All                  # data sources (domains, role templates)
      - Policy.Read.All
      - Policy.ReadWrite.ConditionalAccess  # security defaults (and Conditional Access)
      - Policy.ReadWrite.Authorization      # tenant_settings.authorization_policy

  # HCP Terraform workspace 4esnok_su_subscriptions (Azure tier 1, ESLZ/subscriptions) signs in with OIDC.
  # Directory.Read.All resolves the principal names in its role assignments. Azure RBAC comes from group
  # membership: sg-t1-az-sub-vs-apps-reader (plan) and sg-t1-az-sub-vs-apps-owner (apply).
  - display_name: "sp-hcp-4esnok-su-subscriptions-t1-plan-r0"
    description: "HCP Terraform plan runs of 4esnok/4esnok_su_azure/4esnok_su_subscriptions"
    owners:
      - sysadmin@4esnok.su
    federated_credentials:
      - name: "hcp-plan"
        issuer: "https://app.terraform.io"
        subject: "organization:4esnok:project:4esnok_su_azure:workspace:4esnok_su_subscriptions:run_phase:plan"
    graph_app_roles:
      - Directory.Read.All

  - display_name: "sp-hcp-4esnok-su-subscriptions-t1-apply-r0"
    description: "HCP Terraform apply runs of 4esnok/4esnok_su_azure/4esnok_su_subscriptions"
    owners:
      - sysadmin@4esnok.su
    federated_credentials:
      - name: "hcp-apply"
        issuer: "https://app.terraform.io"
        subject: "organization:4esnok:project:4esnok_su_azure:workspace:4esnok_su_subscriptions:run_phase:apply"
    graph_app_roles:
      - Directory.Read.All

  # Example: an application with a client secret stored in 1Password and a direct EntraID role,
  # used as a group member by display name.
  # - display_name: "sp-t1-example-directory-read"
  #   client_secret:
  #     key_vault_name: "azure_t1"  # 1Password vault
  #     rotation_days: 180          # optional, default 180
  #     overlap_days: 30            # optional, default 30: validity after the rotation date
  #   entraid_role_names:
  #     - Directory Readers
  # (and under groups: members: [sp-t1-example-directory-read])

# PIM needs Entra ID P2, which this tenant does not have (see the example below)
# pim_roles:
#   - role_name: "Global Reader"
#     assignment_type: "User"
#     assignee_name: "developer@4esnok.su"
#     duration: "PT8H"

# Tenant-wide settings
tenant_settings:
  security_defaults: true  # free MFA baseline; this tenant has no Entra ID P1 for Conditional Access
  # Default user and guest permissions (Microsoft Graph authorizationPolicy property names)
  authorization_policy:
    allowInvitesFrom: adminsAndGuestInviters  # only admins and the Guest Inviter role invite guests
    guestUserRoleId: 2af84b1e-32c8-42b7-82bc-daa82404023b  # Restricted Guest User
    blockMsolPowerShell: true
    allowEmailVerifiedUsersToJoinOrganization: false
    allowUserConsentForRiskyApps: false
    defaultUserRolePermissions:
      allowedToCreateApps: false
      allowedToCreateSecurityGroups: false
      allowedToCreateTenants: false
      allowedToReadOtherUsers: true  # never set to false
      allowedToReadBitlockerKeysForOwnedDevice: true
      permissionGrantPoliciesAssigned: []  # users cannot consent to apps; admins approve them

