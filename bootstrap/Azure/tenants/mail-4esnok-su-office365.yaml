# Tenant-wide settings
tenant_settings:
  security_defaults: false  # replaced by the Conditional Access policies below (Entra ID P1)
  # Default user and guest permissions (Microsoft Graph authorizationPolicy property names)
  authorization_policy:
    allowInvitesFrom: adminsAndGuestInviters  # only admins and the Guest Inviter role invite guests
    guestUserRoleId: 2af84b1e-32c8-42b7-82bc-daa82404023b  # Restricted Guest User
    blockMsolPowerShell: true
    allowEmailVerifiedUsersToJoinOrganization: false
    allowUserConsentForRiskyApps: false
    defaultUserRolePermissions:
      allowedToCreateApps: false
      allowedToCreateSecurityGroups: false
      allowedToCreateTenants: false
      allowedToReadOtherUsers: true  # never set to false
      allowedToReadBitlockerKeysForOwnedDevice: true
      permissionGrantPoliciesAssigned: []  # users cannot consent to apps; admins approve them

# Conditional Access (Entra ID P1). Break-glass users are excluded from every policy automatically.
# CA001 and CA002 together replace security defaults; CA003 is report-only until admins have FIDO2 keys.
conditional_access_policies:
  - display_name: "CA001 Block legacy authentication"
    state: enabled
    users:
      include: [All]
    client_app_types: [exchangeActiveSync, other]
    grant:
      controls: [block]

  - display_name: "CA002 Require MFA for all users"
    state: enabled
    users:
      include: [All]
    grant:
      controls: [mfa]

  - display_name: "CA003 Require phishing-resistant MFA for admins"
    state: enabledForReportingButNotEnforced  # report-only; set to enabled once admins use FIDO2 keys
    users:
      include_roles:
        - Global Administrator
        - Privileged Role Administrator
        - Security Administrator
        - User Administrator
        - Application Administrator
        - Cloud Application Administrator
        - Conditional Access Administrator
        - Exchange Administrator
    grant:
      authentication_strength: "Phishing-resistant MFA"

