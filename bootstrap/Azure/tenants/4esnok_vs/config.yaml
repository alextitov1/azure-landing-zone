# Azure tenant registered on domain admin@4esnok.su with VS subscription
# Default domain: admin4esnok.onmicrosoft.com
# Custom domain: vs.4esnok.su
entraid_tenant_id: 05af71f4-43e2-4c1a-8917-3bf5cb165cfe

entra_id:
  users:
    - mail_nickname: breakglass01
      user_principal_name: breakglass01@admin4esnok.onmicrosoft.com
      display_name: Break Glass 01
      organization:
        department: sysadmins
        job_title: Emergency access account
      entraid_role_names:
        - Global Administrator
      password:
        length: 32
        onepassword_vault: cloud_r1

  groups:
    # # Requires AAD Premiumm, using the direct entraid_role_assignments instead.
    # - display_name: sg-prd-entra-globaladmin-t0
    #   description: Global Administrator role for the tenant
    #   assignable_to_role: false
    #   entraid_role_names:
    #     - Global Administrator
    #   members:
    #     - sysadmin

    # Bootstrapping Azure RBAC
    - display_name: sg-prd-az-mg4esnok-owner-t0
      description: Owner on mg-4esnok management group (intermediate root)
      members:
        - sp-prd-az-mg4esnok-owner-hcp-workspace-t1

    # - display_name: sg-prd-az-mg4esnok-reader-t0
    #   description: Reader on mg-4esnok management group (intermediate root)
    #   members: [ ]

  applications:
    - display_name: sp-prd-entraid-global-admin-hcp-workspace-t1
      description: HCP TF workspace 4esnok_vs_entraid_directory_r1
      federated_credentials:
        - name: hcp-4esnok_vs_entraid_directory_r1-apply
          subject: organization:4esnok:project:4esnok_vs_r1:workspace:4esnok_vs_entraid_directory_r1:run_phase:apply
        - name: hcp-4esnok_vs_entraid_directory_r1-plan
          subject: organization:4esnok:project:4esnok_vs_r1:workspace:4esnok_vs_entraid_directory_r1:run_phase:plan
      graph_app_roles:
        - Global Administrator

    - display_name: sp-prd-az-mg4esnok-owner-hcp-workspace-t1
      description: HCP TF workspace 4esnok_vs_azure_governance_r1
      federated_credentials:
        - name: hcp-4esnok_vs_azure_governance_r1-apply
          subject: organization:4esnok:project:4esnok_vs_r1:workspace:4esnok_vs_azure_governance_r1:run_phase:apply
        - name: hcp-4esnok_vs_azure_governance_r1-plan
          subject: organization:4esnok:project:4esnok_vs_r1:workspace:4esnok_vs_azure_governance_r1:run_phase:plan
      graph_app_roles:
        - Group.Read.All

# Intermediate root management group below the tenant root group (CAF),
management_groups:
  name: mg-4esnok
  display_name: 4esnok
  # Hierarchy settings, on the tenant root group; they need Hierarchy Settings Administrator there (../README.md).
  # true (default): new subscriptions go to this group. false: tier 0 leaves the default group as it is, here
  # mg-sandbox, which ESLZ/governance creates and which is set by hand (../README.md).
  default_management_group: false
  # Creating a management group also needs write access on its parent
  require_authorization_for_group_creation: true
  # To groups from entra_id.groups (display names)
  role_assignments:
    - role: Owner
      group: sg-prd-az-mg4esnok-owner-t0
    # - role: Reader
    #   group: sg-prd-az-mg4esnok-reader-t0

