# Intermediate root management group below the tenant root group (CAF),
management_groups:
  name: mg-4esnok
  display_name: "4esnok"
  # Hierarchy settings: new subscriptions always go to this group instead of the tenant root group; with this on,
  # creating a management group also needs write access on its parent. Needs Hierarchy Settings Administrator on
  # the tenant root group (../README.md).
  require_authorization_for_group_creation: true
  # To groups from entra_id.groups (display names)
  role_assignments:
    - role: Owner
      group: sg-prd-az-root-owner-t0
    - role: Reader
      group: sg-prd-az-root-reader-t0
    # ESLZ/governance: management groups (Contributor), policy (Resource Policy Contributor) and role assignments,
    # incl. the policy identities' and Role Based Access Control Administrator for ESLZ pipelines. Contributor can't
    # write Microsoft.Authorization, hence the other two.
    - role: Contributor
      group: sg-prd-az-root-mgmt-t0
    - role: Resource Policy Contributor
      group: sg-prd-az-root-mgmt-t0
    - role: Role Based Access Control Administrator
      group: sg-prd-az-root-mgmt-t0
      # cannot assign or remove Owner or User Access Administrator
      condition: >-
        ((!(ActionMatches{'Microsoft.Authorization/roleAssignments/write'})) OR
        (@Request[Microsoft.Authorization/roleAssignments:RoleDefinitionId] ForAnyOfAllValues:GuidNotEquals
        {8e3af657-a8ff-443c-a75c-2fe8c4bcb635, 18d7d88d-d35e-4fb5-a5c3-7773c20a72d9, f58310d9-a9f6-439a-9e8d-f62e7b41a168}))
        AND ((!(ActionMatches{'Microsoft.Authorization/roleAssignments/delete'})) OR
        (@Resource[Microsoft.Authorization/roleAssignments:RoleDefinitionId] ForAnyOfAllValues:GuidNotEquals
        {8e3af657-a8ff-443c-a75c-2fe8c4bcb635, 18d7d88d-d35e-4fb5-a5c3-7773c20a72d9, f58310d9-a9f6-439a-9e8d-f62e7b41a168}))
