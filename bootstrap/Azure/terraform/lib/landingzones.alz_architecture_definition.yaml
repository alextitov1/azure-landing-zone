# Management group hierarchy of admin.4esnok.su, used by management_groups.tf (Azure/avm-ptn-alz).
# Groups without a parent_id go under the tenant root group. `empty` is the alz provider's built-in archetype:
# no policies or role definitions. Role assignments are in the tenant YAML (management_groups.role_assignments).
name: landingzones
management_groups:
  - id: mg-landingzones
    display_name: Landing zones
    parent_id: null
    exists: false
    archetypes:
      - empty
