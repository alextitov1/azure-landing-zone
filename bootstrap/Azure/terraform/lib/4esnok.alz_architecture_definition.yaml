# Management group hierarchy of admin.4esnok.su, used by management_groups.tf (Azure/avm-ptn-alz): a trimmed
# Azure Landing Zones hierarchy. Groups without a parent_id go under the tenant root group. `empty` is the alz
# provider's built-in archetype: no policies or role definitions. Role assignments are in the tenant YAML
# (management_groups.role_assignments). Changing a group's parent_id recreates the group (see management_groups.tf).
name: 4esnok
management_groups:
  - id: mg-4esnok  # intermediate root: tenant-wide policy and RBAC
    display_name: 4esnok
    parent_id: null
    exists: false
    archetypes:
      - empty
  - id: mg-platform  # shared platform subscriptions (management, connectivity, identity)
    display_name: Platform
    parent_id: mg-4esnok
    exists: false
    archetypes:
      - empty
  - id: mg-landingzones  # workload subscriptions
    display_name: Landing zones
    parent_id: mg-4esnok
    exists: false
    archetypes:
      - empty
  - id: mg-sandbox  # experiments: no connectivity to the platform
    display_name: Sandbox
    parent_id: mg-4esnok
    exists: false
    archetypes:
      - empty
