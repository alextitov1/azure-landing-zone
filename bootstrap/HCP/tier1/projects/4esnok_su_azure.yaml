project: 4esnok_su_azure
description: Azure tenant 4esnok.su
workspaces:
  4esnok_su_entraid_t0_t1:
    # description: Entra ID tier-0 and tier-1 TODO - split them into separate workspaces
    tags: { env: dev, cloud: azure, project: 4esnok.su }

    # # Phase 1 (bootstrap): the pipeline identities do not exist yet, so this workspace only stores state.
    # # Runs execute locally with ./bootstrap-azure-su.sh, signed in with `az login`.
    # execution_mode: local
    # description: "Entra ID tier-0 local (phase 1 of the azure bootstrap)"
    # # End of the phase 1 block

    # Phase 2 (pipeline): once phase 1 has created sp-t0-hcp-entraid-bootstrap-plan/-apply, replace the
    # line above with the block below. Runs then execute in HCP Terraform as those identities (OIDC)
    # and start on merge to main.
    execution_mode: remote
    auto_apply: true
    description: "Entra ID tier-1 remote (phase 2 of the azure bootstrap)"
    azure_oidc:
      apps_workspace: 4esnok_su_entraid_t0_t1            # workspace whose state holds the applications below
      plan_app: sp-hcp-4esnok-su-entraid-t0_t1-plan-r3   # Entra ID application for plan runs (entraid bootstrap creates it)
      apply_app: sp-hcp-4esnok-su-entraid-t0_t1-apply-r0 # Entra ID application for apply runs
    env_vars:
      TF_VAR_tenant_yaml_path: ../tenants/admin.4esnok.su-vs.yaml
    secrets:  # sensitive environment variables, read from 1Password by tier 1 (vault azure_t1)
      TF_VAR_onepassword_service_account_token: op://azure_t1/op_hcp_rw_t1/credential
    vcs:
      working_directory: bootstrap/Azure/terraform
      trigger_patterns: ["/bootstrap/Azure/terraform/**/*", "/bootstrap/Azure/tenants/admin.4esnok.su-vs.yaml"]
    # # End of the phase 2 block

  4esnok_su_subscriptions:
    description: "Azure tier-1: subscriptions and their resource groups"
    tags: { env: prod, cloud: azure, project: 4esnok.su }
    execution_mode: remote
    auto_apply: true
    azure_oidc:  # applications in bootstrap/Azure/tenants/admin.4esnok.su-vs.yaml, created by the same merge
      apps_workspace: 4esnok_su_entraid_t0_t1              # workspace whose state holds the applications below
      plan_app: sp-hcp-4esnok-su-subscriptions-t1-plan-r0   # Reader on the subscriptions
      apply_app: sp-hcp-4esnok-su-subscriptions-t1-apply-r0 # Contributor (or Owner, to assign roles) on the subscriptions
      # subscription_id: <default subscription, optional>
    vcs:
      working_directory: ESLZ/subscriptions

  4esnok_su_connectivity:
    description: "Azure tier-1: lab hub-and-spoke network"
    tags: { env: dev, cloud: azure, project: 4esnok.su }
    execution_mode: remote
    auto_apply: true
    azure_oidc:  # applications in bootstrap/Azure/tenants/admin.4esnok.su-vs.yaml
      apps_workspace: 4esnok_su_entraid_t0_t1
      plan_app: sp-hcp-4esnok-su-connectivity-t1-plan-r0
      apply_app: sp-hcp-4esnok-su-connectivity-t1-apply-r0
    remote_state_consumers: [4esnok_su_cortex]  # workspaces that read the VNet and subnet IDs (tfe_outputs)
    vcs:
      working_directory: ESLZ/connectivity/terraform
      trigger_patterns: ["/ESLZ/connectivity/**/*"]

  4esnok_su_management:
    description: "Azure tier-1: management (central Log Analytics workspace)"
    tags: { env: dev, cloud: azure, project: 4esnok.su }
    execution_mode: remote
    auto_apply: true
    azure_oidc:  # applications in bootstrap/Azure/tenants/admin.4esnok.su-vs.yaml
      apps_workspace: 4esnok_su_entraid_t0_t1
      plan_app: sp-hcp-4esnok-su-management-t1-plan-r0
      apply_app: sp-hcp-4esnok-su-management-t1-apply-r0
    vcs:
      working_directory: ESLZ/management/terraform
      trigger_patterns: ["/ESLZ/management/**/*"]

  4esnok_su_cortex:
    description: "Azure tier-2: workload cortex"
    tags: { env: dev, cloud: azure, project: 4esnok.su }
    execution_mode: remote
    auto_apply: true
    azure_oidc:  # applications in bootstrap/Azure/tenants/admin.4esnok.su-vs.yaml; RBAC on rg-cortex-dev-nzn-01 only
      apps_workspace: 4esnok_su_entraid_t0_t1
      plan_app: sp-hcp-4esnok-su-cortex-t2-plan-r0
      apply_app: sp-hcp-4esnok-su-cortex-t2-apply-r0
    vcs:
      working_directory: ESLZ/workloads/cortex/terraform
      trigger_patterns: ["/ESLZ/workloads/cortex/**/*"]
