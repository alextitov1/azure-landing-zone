project: 4esnok_su_azure
description: Azure tenant 4esnok.su
workspaces:
  4esnok_su_entraid:
    description: Entra ID tier-0 settings
    tags: { env: dev, cloud: azure }
    # Phase 1 (bootstrap): the pipeline identities do not exist yet, so this workspace only stores state.
    # Runs execute locally with ./bootstrap-azure-su.sh, signed in with `az login`.
    # execution_mode: local

    # Phase 2 (pipeline): once phase 1 has created sp-t0-hcp-entraid-bootstrap-plan/-apply, replace the
    # line above with the block below. Runs then execute in HCP Terraform as those identities (OIDC)
    # and start on merge to main.
    execution_mode: remote
    azure_oidc:
      from_workspace: 4esnok_su_entraid   # tenant and client IDs from this workspace's hcp_oidc output
    env_vars:
      TF_VAR_tenant_yaml_path: ../tenants/admin.4esnok.su-vs.yaml
    secrets:  # sensitive environment variables, read from 1Password by tier 1 (vault azure_t1)
      TF_VAR_onepassword_service_account_token: op://azure_t1/op_hcp_rw_t1/credential
    vcs:
      working_directory: bootstrap/Azure/terraform
      trigger_patterns: ["/bootstrap/Azure/terraform/**/*", "/bootstrap/Azure/tenants/admin.4esnok.su-vs.yaml"]

  # 4esnok_su_subscriptions:
