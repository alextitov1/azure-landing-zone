# see schema at ../../HCP/README.md
organization: 4esnok

projects:
  hcp_tf_r1:
    description: "HPC Ring 1 workspaces"
    workspaces:
      hcp_tf_workspaces_r1:
        description: "HCP: manages all other HCP Terraform projects and workspaces"
        execution_mode: remote
        auto_apply: true
        tags: { tier: "1", env: "management", auto_deploy: "false" }
        vcs:
          repo: alextitov1/azure-landing-zone
          github_app_installation: alextitov1  # GitHub App installation (GitHub account) that can see the repo
          branch: main
          working_directory: HCP
          trigger_patterns: ["/HCP/**/*", "/modules/**/*"]
        secrets:  # sensitive environment variables, read from 1Password (op://<vault>/<item>/<field>)
          TFE_TOKEN: op://cloud_r0/hcp_tf_user_hcp_workspace_t1_01/credential  # HCP user token to setup workspaces
          OP_SERVICE_ACCOUNT_TOKEN: op://cloud_r1/op_hcp_workspaces_r1/credential # OP access token to setup other workspaces secrets
  
  4esnok_vs_r0:
    description: "Ring 0 vs.4esnok.su workspaces"
    workspaces:
      4esnok_vs_azure_bootstrap_r0:
        tags: { env: management, cloud: azure, project: vs.4esnok.su, auto_deploy: "false" }
        execution_mode: local
        description: "Bootstrap EntraID and Azure Tenant"
