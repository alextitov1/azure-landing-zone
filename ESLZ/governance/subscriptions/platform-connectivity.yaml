# Platform landing zone connectivity (ESLZ/connectivity): the hub-and-spoke network and its IPAM. It shares the
# Visual Studio subscription; as a subscription of its own, it would go to mg-platform (README.md#subscriptions).
subscription_id: 44b9d159-d353-477f-b94f-5ce0f3bd33f1
location: newzealandnorth

# Namespaces the stack deploys, each with its preview features; its pipeline cannot register them
resource_providers:
  Microsoft.Network: []

resource_groups:
  rg-connectivity-dev-nzn-01:
    role_assignments:
      # Workspace 4esnok_vs_azure_networking_r1 (entraid/tenants/4esnok_vs/config.yaml)
      - role: Reader
        service_principal: sp-hcp-azure-networking-r1-plan
      - role: Contributor
        service_principal: sp-hcp-azure-networking-r1-apply
      # Subnet consumers: assigns and removes Windows 365 Network User, and no other role
      - role: Role Based Access Control Administrator
        service_principal: sp-hcp-azure-networking-r1-apply
        condition: >-
          ((!(ActionMatches{'Microsoft.Authorization/roleAssignments/write'})) OR
          (@Request[Microsoft.Authorization/roleAssignments:RoleDefinitionId] ForAnyOfAnyValues:GuidEquals
          {7eabc9a4-85f7-4f71-b8ab-75daaccc1033}))
          AND ((!(ActionMatches{'Microsoft.Authorization/roleAssignments/delete'})) OR
          (@Resource[Microsoft.Authorization/roleAssignments:RoleDefinitionId] ForAnyOfAnyValues:GuidEquals
          {7eabc9a4-85f7-4f71-b8ab-75daaccc1033}))
