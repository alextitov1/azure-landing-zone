# Platform landing zone connectivity (ESLZ/connectivity)
subscription_id: 44b9d159-d353-477f-b94f-5ce0f3bd33f1
location: newzealandnorth

resource_providers:
  Microsoft.Network: []

resource_groups:
  rg-connectivity-dev-nzn-01:
    role_assignments:
      - role: Reader
        service_principal: sp-hcp-azure-networking-r1-plan
      - role: Contributor
        service_principal: sp-hcp-azure-networking-r1-apply
      # The policy's identity joins private endpoints to the central zones. On the resource group rather than on each
      # zone, so the assignment survives the zones being destroyed and recreated by ESLZ/connectivity.
      - role: Private DNS Zone Contributor
        policy_assignment: mg-landingzones/Deploy-PrivateLink-DNS
      # Only the roles ESLZ/connectivity gives consumers of its resources: Windows 365 Network User (7eabc9a4, subnets),
      # DNS Zone Contributor (befefa01) and Reader (acdd72a7) on public DNS zones
      - role: Role Based Access Control Administrator
        service_principal: sp-hcp-azure-networking-r1-apply
        condition: >-
          ((!(ActionMatches{'Microsoft.Authorization/roleAssignments/write'})) OR
          (@Request[Microsoft.Authorization/roleAssignments:RoleDefinitionId] ForAnyOfAnyValues:GuidEquals
          {7eabc9a4-85f7-4f71-b8ab-75daaccc1033, befefa01-2a29-4197-83a8-272ff33ce314,
          acdd72a7-3385-48ef-bd42-f606fba81ae7}))
          AND ((!(ActionMatches{'Microsoft.Authorization/roleAssignments/delete'})) OR
          (@Resource[Microsoft.Authorization/roleAssignments:RoleDefinitionId] ForAnyOfAnyValues:GuidEquals
          {7eabc9a4-85f7-4f71-b8ab-75daaccc1033, befefa01-2a29-4197-83a8-272ff33ce314,
          acdd72a7-3385-48ef-bd42-f606fba81ae7}))
