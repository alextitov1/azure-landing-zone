# Platform landing zone management (ESLZ/management): the central Log Analytics workspace, managed Prometheus and
# Managed Grafana. It shares the Visual Studio subscription; as a subscription of its own, it would go to
# mg-platform (README.md#subscriptions).
subscription_id: 44b9d159-d353-477f-b94f-5ce0f3bd33f1
location: newzealandnorth

# Namespaces the stack deploys, each with its preview features; its pipeline cannot register them
resource_providers:
  Microsoft.OperationalInsights: []  # Log Analytics
  Microsoft.Monitor: []              # Azure Monitor workspace (managed Prometheus)
  Microsoft.Dashboard: []            # Azure Managed Grafana

resource_groups:
  rg-mgmt-dev-nzn-01:
    role_assignments:
      # Workspace 4esnok_vs_azure_mgmt_r1. Its RBAC Administrator, for Grafana's roles, is on mg-4esnok (config.yaml).
      - role: Contributor
        group: sg-az-mgmt-contributor-t2
      # Grafana roles apply to every Grafana instance in the resource group
      - role: Grafana Admin
        group: sg-az-sub-vs-contributor-t1
      - role: Grafana Viewer
        group: sg-az-sub-vs-reader-t1
