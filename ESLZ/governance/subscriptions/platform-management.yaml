# Platform landing zone management (ESLZ/management)
subscription_id: 44b9d159-d353-477f-b94f-5ce0f3bd33f1
location: newzealandnorth

resource_providers:
  Microsoft.OperationalInsights: []
  Microsoft.Monitor: []
  Microsoft.Insights: []
  Microsoft.Dashboard: []

resource_groups:
  rg-mgmt-dev-nzn-01:
    role_assignments:
      # Workspace 4esnok_vs_azure_mgmt_r1; its Monitoring Contributor on mg-4esnok is in ../config.yaml
      - role: Contributor
        group: sg-az-mgmt-contributor-t2
      # Grafana roles are data plane roles: Contributor and Reader on mg-4esnok don't include them
      - role: Grafana Admin
        group: sg-az-mg4esnok-contributor-t1
      - role: Grafana Viewer
        group: sg-az-mg4esnok-reader-t1

managed_identities:
  # Azure Managed Grafana's identity (grafana.identity in ESLZ/management/config/management.yaml), here because the
  # management pipeline can't assign roles: Azure Monitor metrics and logs across the subscription, and Prometheus
  # metrics in the Azure Monitor workspace
  id-grafana-mgmt-dev-nzn-01:
    resource_group: rg-mgmt-dev-nzn-01
    role_assignments:
      - role: Monitoring Reader
      - role: Monitoring Data Reader
        resource_group: rg-mgmt-dev-nzn-01
