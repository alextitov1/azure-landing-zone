# The Visual Studio subscription of the admin.4esnok.su tenant (entraid/tenants/4esnok_vs/config.yaml) itself: the
# settings of the whole subscription. The other landing zones in it (platform-*.yaml, landingzone-*.yaml) stand in
# for subscriptions of their own and only add resource groups (README.md#subscriptions).
subscription_id: 44b9d159-d353-477f-b94f-5ce0f3bd33f1
location: newzealandnorth

# Renames the subscription when it differs. Needed for `tags` too.
# display_name: "<subscription name>"

# Added to the subscription's tags; tags removed here stay on the subscription.
# tags:
#   env: dev

# Management group ID (not display name). Its first move below mg-4esnok is by hand (README.md#subscriptions).
management_group_id: mg-landingzones

# budgets:
#   monthly:
#     amount: 150
#     start_date: "2026-10-01"   # first day of a month; end_date defaults to 10 years later
#     notifications:
#       - threshold: 80
#         contact_emails: [sysadmin@4esnok.su]
#       - threshold: 100
#         threshold_type: Forecasted

# Users' access to the whole subscription, through groups (entraid/tenants/4esnok_vs/config.yaml): members change
# there, not here. Owner stays outside Terraform. Pipelines get their roles on their own resource groups.
role_assignments:
  - role: Contributor
    group: sg-az-sub-vs-contributor-t1
  - role: Reader
    group: sg-az-sub-vs-reader-t1
