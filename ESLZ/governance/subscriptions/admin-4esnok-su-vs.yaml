# Visual Studio subscription of the admin.4esnok.su tenant (entraid/tenants/4esnok_vs/config.yaml)
subscription_id: 44b9d159-d353-477f-b94f-5ce0f3bd33f1
location: newzealandnorth

# Renames the subscription when it differs. Needed for `tags` too.
# display_name: "<subscription name>"

# Added to the subscription's tags; tags removed here stay on the subscription.
# tags:
#   env: dev

# Management group ID (not display name)
management_group_id: mg-landingzones

# Namespaces to register, each with its preview features. Removing one doesn't unregister it.
# resource_providers:
#   Microsoft.Compute: [EncryptionAtHost]

# budgets:
#   monthly:
#     amount: 150
#     start_date: "2026-10-01"   # first day of a month; end_date defaults to 10 years later
#     notifications:
#       - threshold: 80
#         contact_emails: [sysadmin@4esnok.su]
#       - threshold: 100
#         threshold_type: Forecasted

role_assignments:
  # Workspace 4esnok_vs_azure_networking_r1 (ESLZ/connectivity), which otherwise has roles on its resource group only.
  # The scope of its network manager is this subscription, and Azure creates a network manager only for a caller
  # that can write virtual networks across its scope; Network Contributor is the narrowest built-in role that can.
  - role: Network Contributor
    service_principal: sp-hcp-azure-networking-r1-apply
