# Management groups below the intermediate root mg-4esnok, Azure Policy and Azure RBAC on them, applied by
# ../terraform with Azure/avm-ptn-alz. The hierarchy is the architecture definition
# ../lib/<architecture>.alz_architecture_definition.yaml; mg-4esnok and the rights to build below it come from tier 0
# (bootstrap/Azure/tenants/4esnok_vs). Subscriptions are moved in by their Owner:
# az account management-group subscription add --name <group> --subscription <id>

tenant_id: 05af71f4-43e2-4c1a-8917-3bf5cb165cfe  # tenant 4esnok_vs; its tenant root group is the parent of mg-4esnok

management_groups:
  architecture: 4esnok  # mg-4esnok > mg-platform, mg-landingzones, mg-sandbox
  location: australiaeast  # for policy managed identities
  # Policy assignment parameters, by the default names in ../lib/alz_policy_default_values.json
  policy_default_values:
    # Central workspace of ESLZ/management (rg-mgmt-dev-nzn-01), used by Deploy-AKS-Diag-LAW
    log_analytics_workspace_id: /subscriptions/44b9d159-d353-477f-b94f-5ce0f3bd33f1/resourceGroups/rg-mgmt-dev-nzn-01/providers/Microsoft.OperationalInsights/workspaces/log-mgmt-dev-nzn-01
  role_assignments:  # management_group, role (built-in name), and group (display name) or principal_id + principal_type
    # Pipelines of ESLZ/subscriptions and ESLZ/connectivity, for every subscription in this group
    - management_group: mg-landingzones
      role: Reader
      group: sg-t1-az-sub-vs-apps-reader
    - management_group: mg-landingzones
      role: Contributor
      group: sg-t1-az-sub-vs-apps-contributor
    - management_group: mg-landingzones
      role: Role Based Access Control Administrator
      group: sg-t1-az-sub-vs-apps-contributor
      # cannot assign or remove Owner, User Access Administrator or Role Based Access Control Administrator
      condition: >-
        ((!(ActionMatches{'Microsoft.Authorization/roleAssignments/write'})) OR
        (@Request[Microsoft.Authorization/roleAssignments:RoleDefinitionId] ForAnyOfAllValues:GuidNotEquals
        {8e3af657-a8ff-443c-a75c-2fe8c4bcb635, 18d7d88d-d35e-4fb5-a5c3-7773c20a72d9, f58310d9-a9f6-439a-9e8d-f62e7b41a168}))
        AND ((!(ActionMatches{'Microsoft.Authorization/roleAssignments/delete'})) OR
        (@Resource[Microsoft.Authorization/roleAssignments:RoleDefinitionId] ForAnyOfAllValues:GuidNotEquals
        {8e3af657-a8ff-443c-a75c-2fe8c4bcb635, 18d7d88d-d35e-4fb5-a5c3-7773c20a72d9, f58310d9-a9f6-439a-9e8d-f62e7b41a168}))
    # Account owner of the Visual Studio subscription (live.com#admin@4esnok.su, outside this YAML),
    # to move subscriptions into any of the groups
    - management_group: mg-4esnok
      role: Management Group Contributor
      principal_id: f49d01c8-f39d-43d0-bd83-b57cd145e2b1
      principal_type: User
