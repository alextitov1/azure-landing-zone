# Management groups below the intermediate root mg-4esnok, Azure Policy and Azure RBAC on them; see README.md.
entraid_tenant_id: 05af71f4-43e2-4c1a-8917-3bf5cb165cfe  # 4esnok_vs; its tenant root group is the parent of mg-4esnok

alz_library_references:  # ALZ libraries the alz provider loads
  - path: platform/alz     # CAF reference policy; alz-lib's archetypes pick assignments from it by name
    ref: 2026.11.0
  - custom_url: ./alz-lib  # relative to ESLZ/governance

management_groups:
  architecture: 4esnok     # alz-lib/4esnok.alz_architecture_definition.yaml
  location: australiaeast  # required by the module, for policy managed identities
  policy_default_values:   # assignment parameters, by default name in alz-lib/alz_policy_default_values.json
    allowed_locations: [newzealandnorth, australiaeast]
    # Where Deploy-PrivateLink-DNS writes private endpoints' DNS records: the central zones of ESLZ/connectivity
    private_link_dns_zone_subscription_id: 44b9d159-d353-477f-b94f-5ce0f3bd33f1
    private_link_dns_zone_resource_group_name: rg-connectivity-dev-nzn-01
  role_assignments:        # by management group
    mg-4esnok:
      # Workspace 4esnok_vs_azure_mgmt_r1 (ESLZ/management), which has Contributor on its own resource group only
      # (subscriptions/platform-management.yaml). The platform's monitoring role reaches every landing zone: the
      # Azure Monitor workspace's data collection endpoint is in a resource group that Azure creates, and diagnostic
      # settings and data collection rules go on other teams' resources.
      - role: Monitoring Contributor
        group: sg-az-mgmt-contributor-t2
      # Users, through their groups in entraid/tenants/4esnok_vs/config.yaml
      - role: Contributor
        group: sg-az-mg4esnok-contributor-t1
      - role: Reader
        group: sg-az-mg4esnok-reader-t1
