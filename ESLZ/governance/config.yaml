# Management groups below the intermediate root mg-4esnok, Azure Policy and Azure RBAC on them; see README.md.
entraid_tenant_id: 05af71f4-43e2-4c1a-8917-3bf5cb165cfe  # 4esnok_vs; its tenant root group is the parent of mg-4esnok

alz_library_references:  # ALZ libraries the alz provider loads
  - path: platform/alz     # CAF reference policy; alz-lib's archetypes pick assignments from it by name
    ref: 2026.11.0
  - custom_url: ./alz-lib  # relative to ESLZ/governance

management_groups:
  architecture: 4esnok     # alz-lib/4esnok.alz_architecture_definition.yaml
  location: australiaeast  # required by the module, for policy managed identities
  policy_default_values:   # assignment parameters, by default name in alz-lib/alz_policy_default_values.json
    allowed_locations: [newzealandnorth, australiaeast]
  role_assignments:        # by management group
    # Workspace 4esnok_vs_azure_mgmt_r1 (ESLZ/management). RBAC Administrator only for the roles it gives Grafana's
    # managed identity (Monitoring Reader, Monitoring Data Reader), and only to service principals.
    mg-4esnok:
      - role: Contributor
        group: sg-az-mgmt-contributor-t2
      - role: Role Based Access Control Administrator
        group: sg-az-mgmt-contributor-t2
        # Restrict RBAC changes to Monitoring Reader and Monitoring Data Reader
        # Allow Grafana's managed identity to read Azure Monitor metadata and data
        condition: >-
          ((!(ActionMatches{'Microsoft.Authorization/roleAssignments/write'})) OR
          (@Request[Microsoft.Authorization/roleAssignments:RoleDefinitionId] ForAnyOfAnyValues:GuidEquals
          {43d0d8ad-25c7-4714-9337-8ba259a9fe05, b0d8363b-8ddd-447d-831f-62ca05bff136}
          AND @Request[Microsoft.Authorization/roleAssignments:PrincipalType] ForAnyOfAnyValues:StringEqualsIgnoreCase
          {'ServicePrincipal'}))
          AND ((!(ActionMatches{'Microsoft.Authorization/roleAssignments/delete'})) OR
          (@Resource[Microsoft.Authorization/roleAssignments:RoleDefinitionId] ForAnyOfAnyValues:GuidEquals
          {43d0d8ad-25c7-4714-9337-8ba259a9fe05, b0d8363b-8ddd-447d-831f-62ca05bff136}
          AND @Resource[Microsoft.Authorization/roleAssignments:PrincipalType] ForAnyOfAnyValues:StringEqualsIgnoreCase
          {'ServicePrincipal'}))

    # Pipelines of ESLZ/subscriptions and ESLZ/connectivity, for every subscription in mg-landingzones. Off while
    # their groups are commented out in entraid and their workspaces don't exist.
    # mg-landingzones:
