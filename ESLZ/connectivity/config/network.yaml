# Lab hub-and-spoke network. Address space comes from Azure Virtual Network Manager IPAM:
# VNets and subnets ask for a prefix length and get a range from the pools below.
subscription_id: 44b9d159-d353-477f-b94f-5ce0f3bd33f1
location: newzealandnorth

# Names: <type>-<workload>-<environment>-<region_code>-<instance> (ESLZ/README.md)
environment: dev
region_code: nzn
instance: 1

ipam:
  root: 10.200.0.0/16
  hub: 10.200.0.0/22
  spokes: 10.200.16.0/20

hub:
  prefix_length: 22
  subnets:  # name: prefix length
    GatewaySubnet: 27  # reserved for a VPN gateway
    snet-shared: 24

# name: VNet prefix length and subnets, one NSG per subnet. A subnet is its prefix length, or prefix_length and
# consumers: principals that may join the subnet (NICs, private endpoints), with role Windows 365 Network User
# (read and subnets/join/action) on that subnet only. A consumer is group (display name), user (user principal
# name), service_principal (display name), or principal_id with principal_type, as in ESLZ/subscriptions.
spokes:
  workload:
    prefix_length: 24
    subnets:
      snet-app: 26
  cortex:  # ESLZ/workloads/cortex
    prefix_length: 24
    subnets:
      snet-app:
        prefix_length: 26
        consumers:
          - service_principal: sp-hcp-4esnok-su-cortex-t2-apply-r0
      snet-aks:  # AKS nodes (Azure CNI Overlay: pods get IPs outside the VNet)
        prefix_length: 26
        consumers:
          - service_principal: sp-hcp-4esnok-su-cortex-t2-apply-r0  # creates the cluster in the subnet
          # AKS control plane identity (created by ESLZ/subscriptions, which must be applied first): node NICs
          # and internal load balancers
          - service_principal: id-cortex-aks-dev-nzn-01
    # Ranges used outside the VNet (name: prefix length): IPAM static CIDRs in the spokes pool, so no VNet is
    # ever allocated an overlapping range
    reservations:
      aks-services: 24  # Kubernetes service CIDR of the AKS cluster
