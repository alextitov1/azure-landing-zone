# HCP Terraform tier 1 (hcp_tf_workspaces_r1): organization settings and every project and workspace it manages.
# Edit, open a pull request, review the plan, merge. See README.md for the fields.
organization: 4esnok

projects:
  4esnok_vs_r0:
    description: "Ring 0 vs.4esnok.su workspaces"
    workspaces:
      # 4esnok_vs_entraid_bootstrap_r0:
      #   description: "Entra ID tier 0: admin and break-glass users (bootstrap/Azure, tenant 4esnok_vs)"
      #   tags: { env: dev, cloud: azure, project: vs.4esnok.su }
      #   execution_mode: local  # run by bootstrap/Azure/bootstrap-azure.sh

      4esnok_vs_azure_bootstrap_r0:
        tags: { env: dev, cloud: azure, project: vs.4esnok.su }
        execution_mode: local
        description: "Bootstrap Entra ID, Azure tenant and subscriptions"

      # 4esnok_vs_azure_bootstrap_r0:
      #   description: "Azure: subscriptions and their resource groups"
      #   tags: { env: prod, cloud: azure, project: 4esnok.su }
      #   execution_mode: remote
      #   auto_apply: true
      #   vcs:
      #     repo: alextitov1/azure-landing-zone
      #     github_app_installation: alextitov1
      #     working_directory: ESLZ/subscriptions

  4esnok_vs_r1:
    description: "Ring 1 vs.4esnok.su workspaces"
    workspaces:
      4esnok_vs_entraid_mgmt_r1:
        description: "Entra ID tier 1: users, groups, applications, management groups (entraid, tenant 4esnok_vs)"
        tags: { env: dev, cloud: azure, project: 4esnok.su }
        # Run by entraid/entraid.sh until HCP Terraform's Azure sign-in is reworked; then remote, with
        # vcs (working_directory: entraid) and env_vars: { TF_VAR_tenant: 4esnok_vs }
        execution_mode: local

      4esnok_vs_azure_mgmt_r1:
        description: "Azure: management (central Log Analytics workspace)"
        tags: { env: dev, cloud: azure, project: 4esnok.su }
        execution_mode: remote
        auto_apply: true
        vcs:
          repo: alextitov1/azure-landing-zone
          github_app_installation: alextitov1
          working_directory: ESLZ/management/terraform
          trigger_patterns: ["/ESLZ/management/**/*"]

      4esnok_vs_azure_networking_r1:
        description: "Azure: lab hub-and-spoke network"
        tags: { env: dev, cloud: azure, project: 4esnok.su }
        execution_mode: remote
        auto_apply: true
        remote_state_consumers: [4esnok_vs_azure_cortex_r2]  # workspaces that read the VNet and subnet IDs (tfe_outputs)
        vcs:
          repo: alextitov1/azure-landing-zone
          github_app_installation: alextitov1
          working_directory: ESLZ/connectivity/terraform
          trigger_patterns: ["/ESLZ/connectivity/**/*"]


  4esnok_vs_r2:
    description: "Ring 2 vs.4esnok.su workspaces"
    workspaces:
      4esnok_vs_azure_cortex_r2:
        description: "Azure: workload cortex"
        tags: { env: dev, cloud: azure, project: 4esnok.su }
        execution_mode: remote
        auto_apply: true
        vcs:
          repo: alextitov1/azure-landing-zone
          github_app_installation: alextitov1
          working_directory: ESLZ/workloads/cortex/terraform
          trigger_patterns: ["/ESLZ/workloads/cortex/**/*"]

  4esnok_mail_r0:
    description: "Ring 0 mail.4esnok.su workspaces"
    workspaces:
      4esnok_mail_entraid_bootstrap_r0:
        description: "Entra ID tier 0: admin and break-glass users (bootstrap/Azure, tenant 4esnok_mail)"
        tags: { env: dev, cloud: azure, project: mail.4esnok.su }
        execution_mode: local  # run by bootstrap/Azure/bootstrap-azure.sh

  4esnok_mail_r1:
    description: "Ring 1 mail.4esnok.su workspaces"
    workspaces:
      4esnok_mail_entraid_mgmt_r1:
        description: "Entra ID tier 1: users and Conditional Access (entraid, tenant 4esnok_mail)"
        tags: { env: dev, cloud: azure, project: mail.4esnok.su }
        execution_mode: local  # run by entraid/entraid.sh
