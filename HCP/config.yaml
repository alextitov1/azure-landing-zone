# this config is used to manage all HCP Terraform projects and workspaces in the {{ organization }}.
organization: 4esnok
runner_workspace: hcp_tf_workspaces_r1  # needs to create trigger in the referenced workspaces, tfe://<workspace_name>/...

projects:

  4esnok_vs_r1:
    description: "Ring 1 vs.4esnok.su workspaces"
    variable_sets:
      - name: azure_oidc_project_var_set
        variables:
          TFC_AZURE_PROVIDER_AUTH: "true"
          ARM_TENANT_ID: 05af71f4-43e2-4c1a-8917-3bf5cb165cfe ## 4esnok_vs tenant ID
    workspaces:
      4esnok_vs_entraid_directory_r1:
        description: "Entra ID tier 1: users, groups, applications (entraid, tenant 4esnok_vs)"
        tags: { env: mgmt, cloud: azure }
        execution_mode: remote
        auto_apply: true
        vcs:
          repo: alextitov1/azure-landing-zone
          github_app_installation: alextitov1
          working_directory: entraid
          trigger_patterns: ["/entraid/*", "/entraid/tenants/4esnok_vs/**/*", "/modules/**/*"]
        variables:
          TF_VAR_tenant: 4esnok_vs  # entraid/tenants/<tenant>
          TFC_AZURE_PLAN_CLIENT_ID: tfe://4esnok_vs_azure_bootstrap_r0/client_ids/sp-prd-entraid-global-admin-hcp-workspace-t1
          TFC_AZURE_APPLY_CLIENT_ID: tfe://4esnok_vs_azure_bootstrap_r0/client_ids/sp-prd-entraid-global-admin-hcp-workspace-t1
        secrets:  # stores user passwords and client secrets in the vaults the tenant config names
          OP_SERVICE_ACCOUNT_TOKEN: op://cloud_r1/op_hcp_workspaces_t1/credential

      4esnok_vs_azure_governance_r1:
        description: "Azure: management groups below mg-4esnok, policy and RBAC on them, subscription vending (ESLZ/governance)"
        tags: { env: mgmt, cloud: azure }
        execution_mode: remote
        auto_apply: true
        vcs:
          repo: alextitov1/azure-landing-zone
          github_app_installation: alextitov1
          working_directory: ESLZ/governance
          trigger_patterns:
            - "/ESLZ/governance/**/*"
            - "/modules/azure-management-groups/**/*"
            - "/modules/azure-subscription-vending/**/*"
        variables:
          TFC_AZURE_PLAN_CLIENT_ID: tfe://4esnok_vs_azure_bootstrap_r0/client_ids/sp-prd-az-mg4esnok-owner-hcp-workspace-t1
          TFC_AZURE_APPLY_CLIENT_ID: tfe://4esnok_vs_azure_bootstrap_r0/client_ids/sp-prd-az-mg4esnok-owner-hcp-workspace-t1

      4esnok_vs_azure_mgmt_r1:
        description: "Azure: management (central Log Analytics workspace, managed Prometheus, Managed Grafana, Azure Monitor private link scope)"
        tags: { env: mgmt, cloud: azure }
        execution_mode: remote
        auto_apply: true
        vcs:
          repo: alextitov1/azure-landing-zone
          github_app_installation: alextitov1
          working_directory: ESLZ/management/terraform
          trigger_patterns: ["/ESLZ/management/**/*", "/modules/azure-management/**/*"]
        variables:
          TFC_AZURE_PLAN_CLIENT_ID: tfe://4esnok_vs_entraid_directory_r1/client_ids/sp-prd-az-mgmt-contributor-hcp-workspace-t2
          TFC_AZURE_APPLY_CLIENT_ID: tfe://4esnok_vs_entraid_directory_r1/client_ids/sp-prd-az-mgmt-contributor-hcp-workspace-t2

      4esnok_vs_azure_networking_r1:
        description: "Azure: lab hub-and-spoke network, private and public DNS zones (ESLZ/connectivity)"
        tags: { env: dev, cloud: azure, project: 4esnok.su }
        execution_mode: remote
        auto_apply: true
        remote_state:  # workspaces that read the VNet, subnet and private DNS zone IDs (tfe_outputs)
          share_with: workspaces
          # add 4esnok_vs_azure_cortex_r2 once its workspace below is uncommented
          workspaces: [4esnok_vs_azure_mgmt_r1, 4esnok_vs_azure_jumpbox_r2]
        vcs:
          repo: alextitov1/azure-landing-zone
          github_app_installation: alextitov1
          working_directory: ESLZ/connectivity/terraform
          trigger_patterns:
            - "/ESLZ/connectivity/**/*"
            - "/modules/azure-connectivity/**/*"
        variables:
          TFC_AZURE_PLAN_CLIENT_ID: tfe://4esnok_vs_entraid_directory_r1/client_ids/sp-hcp-azure-networking-r1-plan
          TFC_AZURE_APPLY_CLIENT_ID: tfe://4esnok_vs_entraid_directory_r1/client_ids/sp-hcp-azure-networking-r1-apply


  4esnok_vs_r2:
    description: "Ring 2 vs.4esnok.su workspaces"
    variable_sets:
      - name: 4esnok_vs_r2-azure
        # Azure dynamic credentials; each workspace's client IDs are its `variables:`
        variables:
          TFC_AZURE_PROVIDER_AUTH: "true"
          ARM_TENANT_ID: 05af71f4-43e2-4c1a-8917-3bf5cb165cfe
    workspaces:
      4esnok_vs_azure_jumpbox_r2:
        description: "Azure: workload jumpbox (ESLZ/workloads/jumpbox)"
        tags: { env: dev, cloud: azure, project: 4esnok.su }
        execution_mode: remote
        auto_apply: true
        vcs:
          repo: alextitov1/azure-landing-zone
          github_app_installation: alextitov1
          working_directory: ESLZ/workloads/jumpbox/terraform
          trigger_patterns: ["/ESLZ/workloads/jumpbox/**/*", "/modules/azure-windows-jumpbox/**/*"]
        variables:
          TFC_AZURE_PLAN_CLIENT_ID: tfe://4esnok_vs_entraid_directory_r1/client_ids/sp-hcp-4esnok-su-jumpbox-t2-plan-r0
          TFC_AZURE_APPLY_CLIENT_ID: tfe://4esnok_vs_entraid_directory_r1/client_ids/sp-hcp-4esnok-su-jumpbox-t2-apply-r0

